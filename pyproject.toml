[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sierra-customer-service-agent"
version = "0.1.0"
description = "Grounded Sierra Outfitters customer service with transactional business tools"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.2",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "pydantic-settings>=2.6,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::ResourceWarning"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
