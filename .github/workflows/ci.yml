name: Sierra MVP checks
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sierra
          POSTGRES_PASSWORD: sierra-test-only
          POSTGRES_DB: sierra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sierra"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt && pip install -e '.[dev]'
      - run: ruff check backend scripts
      - if: matrix.database == 'sqlite'
        run: pytest -q
      - if: matrix.database == 'postgres'
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://sierra:sierra-test-only@127.0.0.1:5432/sierra
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend audit --omit=dev
